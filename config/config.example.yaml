# DataMetrics Agent Configuration File

# Application settings
app:
  name: "DataMetrics Agent"
  version: "0.1.0"
  debug: false
  log_level: "INFO"
  host: "0.0.0.0"
  port: 8000

# Database connections
databases:
  # Default database for metadata storage
  metadata:
    type: "postgresql"
    host: "localhost"
    port: 5432
    database: "datametrics_metadata"
    username: "datametrics"
    password: "your_password"
    pool_size: 10
    max_overflow: 20
    
  # Data source connections
  sources:
    mysql_prod:
      type: "mysql"
      host: "mysql.example.com"
      port: 3306
      database: "production"
      username: "readonly_user"
      password: "readonly_password"
      
    clickhouse_analytics:
      type: "clickhouse"
      host: "clickhouse.example.com"
      port: 9000
      database: "analytics"
      username: "analytics_user"
      password: "analytics_password"
      
    postgres_warehouse:
      type: "postgresql"
      host: "warehouse.example.com"
      port: 5432
      database: "data_warehouse"
      username: "warehouse_user"
      password: "warehouse_password"

# AI/NLP settings
ai:
  # OpenAI configuration
  openai:
    api_key: "your_openai_api_key"
    model: "gpt-4"
    max_tokens: 2000
    temperature: 0.1
    
  # Local NLP models
  local_models:
    enabled: false
    model_path: "/models"
    device: "cpu"  # or "cuda"

# Monitoring and alerting
monitoring:
  enabled: true
  
  # Prometheus metrics
  prometheus:
    enabled: true
    port: 9090
    
  # Alert channels
  alerts:
    email:
      enabled: true
      smtp_server: "smtp.example.com"
      smtp_port: 587
      username: "alerts@example.com"
      password: "email_password"
      
    slack:
      enabled: false
      webhook_url: "https://hooks.slack.com/services/..."
      
    webhook:
      enabled: false
      url: "https://your-webhook-endpoint.com"

# Cache settings
cache:
  type: "redis"  # redis, memory, or disabled
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: null
    ttl: 3600  # seconds

# Security settings
security:
  secret_key: "your-secret-key-change-this"
  algorithm: "HS256"
  access_token_expire_minutes: 30
  
  # API rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100

# Logging configuration
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  rotation: "1 day"
  retention: "30 days"
  compression: "gz"
  
  # Log to file
  file:
    enabled: true
    path: "logs/datametrics_agent.log"
    
  # Log to console
  console:
    enabled: true
    colorize: true

# Feature flags
features:
  nlp_processing: true
  sql_optimization: true
  data_lineage: true
  real_time_monitoring: true
  auto_documentation: true

# Template settings
templates:
  path: "config/templates"
  auto_reload: true
  
# Development settings (only used when debug=true)
development:
  auto_reload: true
  show_sql: true
  mock_ai_responses: false